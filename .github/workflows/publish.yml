name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate current static build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check application script
        run: node --check dist/assets/app.js

      - name: Run tests
        run: node --test tests/*.test.mjs

  package:
    name: Upload downloadable package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create static package
        run: |
          mkdir -p release
          zip -r release/luck-door-static.zip dist docs README.md

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: luck-door-static
          path: release/luck-door-static.zip
          retention-days: 30

  deploy-pages:
    name: Publish gh-pages branch
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish static site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
